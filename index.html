    <script>
      (function () {
        var WALLET_PROPS = {
          isZerion: true,
          ethereum: true,
          isMetaMask: true,
          isRabby: true,
          isBraveWallet: true,
          isPhantom: true,
          isCoinbaseWallet: true,
          isOkxWallet: true,
          isTrust: true,
          providers: true
        };

        var origDefineProperty = Object.defineProperty;
        var origDefineProperties = Object.defineProperties;
        var origReflectDefineProperty =
          typeof Reflect !== 'undefined' && Reflect.defineProperty
            ? Reflect.defineProperty
            : null;

        function patchDescriptor(obj, prop, descriptor) {
          if (!descriptor || typeof descriptor !== 'object') return descriptor;
          if (obj === window || WALLET_PROPS[prop]) {
            var copy = {};
            for (var k in descriptor) {
              if (Object.prototype.hasOwnProperty.call(descriptor, k)) {
                copy[k] = descriptor[k];
              }
            }
            copy.configurable = true;
            return copy;
          }
          return descriptor;
        }

        Object.defineProperty = function (obj, prop, descriptor) {
          try {
            return origDefineProperty.call(
              Object,
              obj,
              prop,
              patchDescriptor(obj, prop, descriptor)
            );
          } catch (err) {
            try {
              return origDefineProperty.call(Object, obj, prop, descriptor);
            } catch (_innerErr) {
              return obj;
            }
          }
        };

        Object.defineProperties = function (obj, props) {
          try {
            if (props && typeof props === 'object') {
              var patched = {};
              for (var key in props) {
                if (Object.prototype.hasOwnProperty.call(props, key)) {
                  patched[key] = patchDescriptor(obj, key, props[key]);
                }
              }
              return origDefineProperties.call(Object, obj, patched);
            }
            return origDefineProperties.call(Object, obj, props);
          } catch (_err) {
            return obj;
          }
        };

        if (origReflectDefineProperty) {
          Reflect.defineProperty = function (target, propertyKey, attributes) {
            try {
              return origReflectDefineProperty.call(
                Reflect,
                target,
                propertyKey,
                patchDescriptor(target, propertyKey, attributes)
              );
            } catch (_err) {
              return true;
            }
          };
        }

        function isExtensionNoise(msg, source, stack) {
          var m = String(msg || '');
          var s = String(source || '');
          var st = String(stack || '');
          return (
            m.indexOf('isZerion') !== -1 ||
            m.indexOf('Cannot redefine property') !== -1 ||
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            st.indexOf('chrome-extension://') !== -1 ||
            st.indexOf('moz-extension://') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var errStack = event && event.error && event.error.stack ? event.error.stack : '';
            if (isExtensionNoise(event && event.message, event && event.filename, errStack)) {
              event.stopImmediatePropagation();
              event.stopPropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = reason && reason.message ? reason.message : String(reason || '');
            var stack = reason && reason.stack ? reason.stack : '';
            if (isExtensionNoise(msg, '', stack)) {
              event.stopImmediatePropagation();
              event.stopPropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        var prevOnError = window.onerror;
        window.onerror = function (message, source, lineno, colno, error) {
          var stack = error && error.stack ? error.stack : '';
          if (isExtensionNoise(message, source, stack)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
