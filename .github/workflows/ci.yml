name: MintPulse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck-and-test:
    name: Lint, Type-Check & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mintpulse
          POSTGRES_PASSWORD: mintpulse_test_password
          POSTGRES_DB: mintpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database schema migrations
        env:
          PGPASSWORD: mintpulse_test_password
        run: |
          psql -h localhost -U mintpulse -d mintpulse_test -f migrations/001_initial_schema.sql

      - name: Run TypeScript type-checking
        run: bun run lint

      - name: Run automated test suite
        env:
          DATABASE_URL: postgresql://mintpulse:mintpulse_test_password@localhost:5432/mintpulse_test
          NODE_ENV: test
        run: bun run test

      - name: Build production bundle
        run: bun run build
