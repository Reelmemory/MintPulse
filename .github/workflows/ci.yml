name: MintPulse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck-and-test:
    name: Lint, Type-Check & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mintpulse
          POSTGRES_PASSWORD: mintpulse_test_password
          POSTGRES_DB: mintpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database schema migrations
        env:
          PGPASSWORD: mintpulse_test_password
        run: |
          psql -h localhost -U mintpulse -d mintpulse_test -f migrations/001_initial_schema.sql

      - name: Run TypeScript type-checking & linter
        run: npm run lint

      - name: Run automated test suite (Discovery, SSRF, Scheduler, Timezones, Permissions)
        env:
          DATABASE_URL: postgresql://mintpulse:mintpulse_test_password@localhost:5432/mintpulse_test
          NODE_ENV: test
        run: npm test

      - name: Build production bundle
        run: npm run build
